apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  namespace: format-security
  labels:
    app.kubernetes.io/name: audit
    app.kubernetes.io/part-of: format-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/part-of: format-security
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: audit
          image: format-security-audit:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: audit
            - name: SERVICE_PORT
              value: "8084"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: format-security-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: audit
  namespace: format-security
  labels:
    app.kubernetes.io/name: audit
    app.kubernetes.io/part-of: format-security
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: audit
  ports:
    - name: http
      port: 8084
      targetPort: http
      protocol: TCP

# Демонстрационные значения. Не использовать в production.
apiVersion: v1
kind: Secret
metadata:
  name: format-security-secrets
  namespace: format-security
type: Opaque
stringData:
  POSTGRES_DB: format_security
  POSTGRES_USER: format_security
  POSTGRES_PASSWORD: change-me-postgres
  DATABASE_URL: postgresql://format_security:change-me-postgres@postgres:5432/format_security
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: change-me-minio
  GRAFANA_ADMIN_USER: admin
  GRAFANA_ADMIN_PASSWORD: format-security-admin
